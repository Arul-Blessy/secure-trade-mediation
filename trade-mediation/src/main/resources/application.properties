spring.application.name=trade-mediation
server.port=${PORT:8080}

# Optional local file holding your real secrets. It is never committed to Git.
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trade_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-it-must-be-32-chars-or-more}
app.jwt.expiration-ms=86400000

app.demo-mode=true
app.cors.allowed-origins=http://localhost:5173

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=0
management.health.db.enabled=false